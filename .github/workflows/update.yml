name: Actualizar datos LoL

on:
  schedule:
    # Cada 20 min entre las 17:00 y 22:00 de Argentina (LAS, UTC-3) = 20:00-01:00 UTC.
    # GitHub Actions usa UTC. Los crons pueden retrasarse unos minutos con carga alta.
    - cron: "0,20,40 20-23 * * *"   # ART 17:00 - 20:40
    - cron: "0,20,40 0 * * *"       # ART 21:00 - 21:40
    - cron: "0 1 * * *"             # ART 22:00
  workflow_dispatch:          # "Run workflow" para forzar una actualización manual
  push:
    branches: [ main ]
    paths: [ "data/players.json" ]  # re-fetch si cambiás la config

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bajar datos de Riot
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: python scripts/fetch.py

      - name: Commit de los datos actualizados
        run: |
          git config user.name "lol-dashboard-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "chore: actualizar datos LoL [skip ci]"
            # Si el remoto avanzó entre checkout y push, rebasear (preferir
            # nuestros datos recién bajados) y reintentar hasta 3 veces.
            for i in 1 2 3; do
              git pull --rebase -X theirs --autostash origin main \
                && git push && { echo "push OK"; break; }
              echo "push rechazado, reintento $i..."
              sleep 4
            done
          fi
